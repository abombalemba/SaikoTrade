<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link rel="stylesheet" href="css/styles.css">

	<link rel="icon" href="images/logo/favicon.ico">

	<title>Сыворотка с антиоксидантами Amaranth APP-С Fulla Serum,30ml|купить в интернет-магазине японских товаров SaikoTrade - Интернет-магазин японской косметики Сайко</title>
</head>

<body>
    <header id="header"></header>

	<div class="body">
		<div id="body-left"></div>

		<div id="card"></div>
	</div>

	<span class="footer-horizontal-divider"></span>

    <footer id="footer"></footer>

	<script src="js/flow.js"></script>
	<script type="module" src="js/main.js"></script>
			
	<script>
		function initTabs() {
			const buttons = document.querySelectorAll('.card-info-button');
			const tabs = document.querySelectorAll('.tab-content');
			
			if(buttons.length === 0 || tabs.length === 0) {
				return;
			}
			
			buttons.forEach(button => {
				button.addEventListener('click', function() {
					buttons.forEach(btn => btn.classList.remove('active'));
					tabs.forEach(tab => tab.classList.remove('active'));
					
					this.classList.add('active');
					const tabId = this.getAttribute('data-tab');
					document.getElementById(tabId)?.classList.add('active');
				});
			});
			
			buttons[0]?.click();
		}
	
		if (document.readyState === 'complete') {
			initTabs();
		} else {
			window.addEventListener('load', initTabs);
		}
	</script>

	<script>
		function initQuantityControls() {
			const minusBtn = document.getElementById('card-preview-right-block-block-choice-minus');
			const plusBtn = document.getElementById('card-preview-right-block-block-choice-plus');
			const input = document.getElementById('card-preview-right-block-block-choice-input');

			if (!minusBtn || !plusBtn || !input) {
				setTimeout(initQuantityControls, 100);
				return;
			}
			
			function updateValue(change) {
				let value = parseInt(input.value) || 0;
				value += change;
				if (value < 1) value = 1;
				if (value > 999) value = 999;
				input.value = value;
			}

			minusBtn.addEventListener('click', (e) => {
				e.preventDefault();
				updateValue(-1);
			});

			plusBtn.addEventListener('click', (e) => {
				e.preventDefault();
				updateValue(1);
			});

			input.addEventListener('input', () => {
				let value = parseInt(input.value) || 1;
				if (isNaN(value) || value < 1) value = 1;
				if (value > 999) value = 999;
				input.value = value;
			});

			input.addEventListener('change', () => {
				if (!input.value) input.value = 1;
			});
		}

		if (document.readyState === 'complete') {
			initQuantityControls();
		} else {
			window.addEventListener('load', initQuantityControls);
			document.addEventListener('DOMContentLoaded', initQuantityControls);
		}
	</script>
</body>

</html>
