<header id="header">
	<div id="header-center">
		<div id="header-center-logo">
			<a href="/">
				<img id="header-center-logo-image" src="images/logo/logo.png" alt="logo">
			</a>
		</div>
	
		<div id="header-center-contacts">
			<div id="header-center-contact">
				<img src="images/icons/phone-black.svg" alt="phone">
				<p id="header-center-contact-number" class="poppins-14-bold">+8180-58-53-55-25</p>
			</div>
	
			<div id="header-center-contact">
				<img src="images/icons/email.svg" alt="email">
				<p id="header-center-contact-email" class="poppins-14-bold">info@saikotrade.com</p>
			</div>
		</div>
	</div>
	
	<div id="header-down">
		<div id="header-center-search">
			<input id="header-center-search-field" type="text" placeholder="Поиск по сайту...">
			<div id="header-center-search-button" onmouseover="headerCenterSearch(true)" onmouseout="headerCenterSearch(false)">
				<img src="images/icons/search.svg" alt="search">
			</div>
		</div>

		<div class="mobile-menu">
			<button class="burger-button">
				<span></span>
				<span></span>
				<span></span>
			</button>
			
			<div class="header-down-blocks-mobile">
				<a class="header-down-block header-down-block--first open-sans-14-bold" href="https://saikotrade.com/">
					ГЛАВНАЯ
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/katalog-tovarov/">
					КАТАЛОГ
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/dostavka-i-oplata/">
					ДОСТАВКА И ОПЛАТА
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/kak-zakazat/">
					КАК ЗАКАЗАТЬ
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/otsledit-posylku/">
					ОТСЛЕЖИВАНИЕ
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/o-nas/">
					О НАС
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/otzyvy/">
					ОТЗЫВЫ
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/blog/">
					ПОЛЕЗНЫЕ СТАТЬИ
				</a>
				<a class="header-down-block open-sans-14-bold" href="https://saikotrade.com/kontakty/">
					КОНТАКТЫ
				</a>
			</div>

			<div class="menu-overlay"></div>
		</div>

		<script>
document.addEventListener('DOMContentLoaded', function() {
    const burgerButton = document.querySelector('.burger-button');
    const mobileMenu = document.querySelector('.mobile-menu');
    const menuOverlay = document.querySelector('.menu-overlay');
    
    // Открытие/закрытие по кнопке
    burgerButton.addEventListener('click', function(e) {
        e.stopPropagation();
        mobileMenu.classList.toggle('active');
    });
    
    // Закрытие по клику на overlay
    menuOverlay.addEventListener('click', function() {
        mobileMenu.classList.remove('active');
    });
    
    // Закрытие по клику в любом месте документа
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.header-down-blocks-mobile') && 
            !e.target.closest('.burger-button')) {
            mobileMenu.classList.remove('active');
        }
    });
});
		</script>
	</div>
</header>
